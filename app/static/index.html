<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>智能客服</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f7;
      --shell: #ffffff;
      --line: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --brand: #2563eb;
      --brand-soft: #dbeafe;
      --bot-bg: #f8fafc;
      --danger: #b91c1c;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "PingFang SC", "Noto Sans SC", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 880px;
      margin: 0 auto;
      background: var(--shell);
      box-shadow: var(--shadow);
    }
    header.top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      flex-shrink: 0;
    }
    header.top h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 600;
      white-space: nowrap;
    }
    .top-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
    }
    .top-meta label { white-space: nowrap; }
    .top-meta input {
      width: 120px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13px;
    }
    .hint { color: var(--muted); line-height: 1.35; }
    .top-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    button.ghost, a.ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }
    button.ghost:hover, a.ghost:hover { background: #f9fafb; }
    button.ghost:disabled { opacity: 0.55; cursor: not-allowed; }

    .log {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
    }
    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 24px;
    }
    .row {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      gap: 4px;
    }
    .row.user { align-self: flex-end; align-items: flex-end; }
    .row.bot { align-self: flex-start; align-items: flex-start; }
    .status {
      font-size: 12px;
      color: var(--muted);
      padding: 0 4px;
      min-height: 0;
    }
    .status:empty { display: none; }
    .msg {
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 15px;
      word-break: break-word;
      box-shadow: var(--shadow);
    }
    .row.user .msg {
      background: var(--brand);
      color: #fff;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }
    .row.bot .msg {
      background: var(--bot-bg);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
    }
    .row.bot .msg.error {
      color: var(--danger);
      border-color: #fecaca;
      background: #fef2f2;
    }
    .row.bot .msg.streaming { white-space: pre-wrap; }
    .row.bot .msg.md :first-child { margin-top: 0; }
    .row.bot .msg.md :last-child { margin-bottom: 0; }
    .row.bot .msg.md h1,
    .row.bot .msg.md h2,
    .row.bot .msg.md h3 {
      font-size: 1.05em;
      margin: 0.6em 0 0.35em;
      line-height: 1.35;
    }
    .row.bot .msg.md p { margin: 0.4em 0; }
    .row.bot .msg.md ul,
    .row.bot .msg.md ol { margin: 0.4em 0; padding-left: 1.25em; }
    .row.bot .msg.md li { margin: 0.15em 0; }
    .row.bot .msg.md code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9em;
      background: #eef2ff;
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
    .row.bot .msg.md pre {
      overflow-x: auto;
      background: #0f172a;
      color: #e2e8f0;
      padding: 10px 12px;
      border-radius: 8px;
      margin: 0.5em 0;
    }
    .row.bot .msg.md pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }
    .row.bot .msg.md a { color: var(--brand); }
    .row.bot .msg.md blockquote {
      margin: 0.4em 0;
      padding-left: 0.75em;
      border-left: 3px solid var(--line);
      color: var(--muted);
    }
    .feedback {
      display: flex;
      gap: 6px;
      padding: 0 2px;
      min-height: 28px;
    }
    .feedback button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 2px 10px;
      font-size: 13px;
      cursor: pointer;
      color: var(--muted);
      line-height: 1.4;
    }
    .feedback button:hover:not(:disabled) {
      border-color: #93c5fd;
      background: var(--brand-soft);
      color: var(--text);
    }
    .feedback button:disabled { opacity: 0.55; cursor: default; }
    .feedback button.active-up {
      border-color: #86efac;
      background: #f0fdf4;
      color: #166534;
    }
    .feedback button.active-down {
      border-color: #fecaca;
      background: #fef2f2;
      color: var(--danger);
    }
    .feedback .fb-hint {
      font-size: 12px;
      color: var(--muted);
      align-self: center;
    }

    .composer {
      flex-shrink: 0;
      border-top: 1px solid var(--line);
      background: #fff;
      padding: 10px 16px 14px;
    }
    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .chips:empty { display: none; margin: 0; }
    button.chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
    }
    button.chip:hover { border-color: #93c5fd; background: var(--brand-soft); }
    button.chip:disabled { opacity: 0.55; cursor: not-allowed; }
    form#form {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    form#form input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      font-size: 15px;
      outline: none;
    }
    form#form input:focus { border-color: #93c5fd; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    form#form input:disabled { background: #f9fafb; }
    button.send {
      background: var(--brand);
      color: #fff;
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
    }
    button.send:hover { background: #1d4ed8; }
    button.send:disabled { opacity: 0.6; cursor: not-allowed; }

    @media (max-width: 640px) {
      .hint { display: none; }
      .top-meta input { width: 100px; }
      .row { max-width: 92%; }
      header.top { padding: 10px 12px; }
      .log { padding: 14px 12px; }
      .composer { padding: 8px 12px 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>智能客服</h1>
      <div class="top-meta">
        <label for="user">用户 ID</label>
        <input id="user" value="u10001" placeholder="anonymous" autocomplete="off" />
        <span class="hint">演示订单 20251114001 属于 u10001</span>
      </div>
      <div class="top-actions">
        <button type="button" class="ghost" id="newSession">新会话</button>
        <a class="ghost" href="/graph" target="_blank" rel="noopener">流程图</a>
      </div>
    </header>

    <section class="log" id="log" aria-live="polite">
      <div class="empty" id="empty">正在加载开场白…</div>
    </section>

    <div class="composer">
      <div class="chips" id="chips">
        <button class="chip" type="button" data-q="Python入门课包含哪些内容？">课程咨询</button>
        <button class="chip" type="button" data-q="查询订单#20251114001的退款进度">订单查询</button>
        <button class="chip" type="button" data-q="转人工">转人工</button>
      </div>
      <form id="form">
        <input id="input" placeholder="输入问题，按回车发送" autocomplete="off" />
        <button class="send" type="submit">发送</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const userInput = document.getElementById("user");
    const form = document.getElementById("form");
    const chips = document.getElementById("chips");
    const newSessionBtn = document.getElementById("newSession");
    const sendBtn = form.querySelector("button.send");

    const savedUser = sessionStorage.getItem("cs_user_id");
    if (savedUser) userInput.value = savedUser;

    if (window.marked && typeof marked.setOptions === "function") {
      marked.setOptions({ breaks: true, gfm: true });
    }

    function currentUser() {
      return (userInput.value || "").trim() || "anonymous";
    }

    function setPending(pending) {
      form.dataset.pending = pending ? "1" : "0";
      sendBtn.disabled = pending;
      input.disabled = pending;
      newSessionBtn.disabled = pending;
      chips.querySelectorAll("button.chip").forEach((btn) => {
        btn.disabled = pending;
      });
    }

    function hideEmpty() {
      const el = document.getElementById("empty");
      if (el) el.remove();
    }

    function scrollLog() {
      log.scrollTop = log.scrollHeight;
    }

    function renderMarkdown(text) {
      const raw = text || "";
      if (!window.marked || !window.DOMPurify) {
        return { html: null, plain: raw };
      }
      const unsafe = marked.parse(raw);
      const html = DOMPurify.sanitize(unsafe, {
        ALLOWED_TAGS: [
          "p", "br", "strong", "em", "b", "i", "u", "code", "pre",
          "ul", "ol", "li", "h1", "h2", "h3", "h4", "blockquote", "a", "hr", "span"
        ],
        ALLOWED_ATTR: ["href", "title", "target", "rel"],
        ALLOWED_URI_REGEXP: /^(?:(?:https?|mailto):|[^a-z]|[a-z+.\-]+(?:[^a-z+.\-:]|$))/i
      });
      return { html, plain: raw };
    }

    function addUser(text) {
      hideEmpty();
      const row = document.createElement("div");
      row.className = "row user";
      const msg = document.createElement("div");
      msg.className = "msg";
      msg.textContent = text;
      row.appendChild(msg);
      log.appendChild(row);
      scrollLog();
    }

    function addBotShell() {
      hideEmpty();
      const row = document.createElement("div");
      row.className = "row bot";
      const status = document.createElement("div");
      status.className = "status";
      const msg = document.createElement("div");
      msg.className = "msg streaming";
      msg.textContent = "";
      const feedback = document.createElement("div");
      feedback.className = "feedback";
      feedback.hidden = true;
      row.appendChild(status);
      row.appendChild(msg);
      row.appendChild(feedback);
      log.appendChild(row);
      scrollLog();
      return {
        row,
        status,
        msg,
        feedback,
        buffer: "",
        gotToken: false,
        requestId: "",
        traceId: "",
        sessionId: ""
      };
    }

    function attachFeedback(shell) {
      const box = shell.feedback;
      if (!box) return;
      // 无 trace 时仍可记 Prometheus；有 session/request 也能挂 Langfuse session score
      if (!shell.traceId && !shell.requestId && !shell.sessionId) return;
      box.hidden = false;
      box.innerHTML = "";
      const up = document.createElement("button");
      up.type = "button";
      up.textContent = "有用";
      up.title = "有用";
      const down = document.createElement("button");
      down.type = "button";
      down.textContent = "无用";
      down.title = "无用";
      const hint = document.createElement("span");
      hint.className = "fb-hint";
      async function send(value, btn, other) {
        if (box.dataset.sent === "1") return;
        btn.disabled = true;
        other.disabled = true;
        try {
          const res = await fetch("/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Tenant-Id": "demo" },
            body: JSON.stringify({
              trace_id: shell.traceId || "",
              value,
              request_id: shell.requestId || undefined,
              session_id: shell.sessionId || sessionStorage.getItem("cs_session_id") || undefined
            })
          });
          if (!res.ok) throw new Error("feedback failed");
          box.dataset.sent = "1";
          btn.classList.add(value === 1 ? "active-up" : "active-down");
          hint.textContent = "已记录";
        } catch (_) {
          btn.disabled = false;
          other.disabled = false;
          hint.textContent = "提交失败，请重试";
        }
      }
      up.onclick = () => send(1, up, down);
      down.onclick = () => send(0, down, up);
      box.appendChild(up);
      box.appendChild(down);
      box.appendChild(hint);
    }

    function setBotPlain(shell, text) {
      shell.msg.classList.remove("md", "error");
      shell.msg.classList.add("streaming");
      shell.msg.textContent = text;
      shell.buffer = text;
    }

    function appendBotToken(shell, piece) {
      if (!piece) return;
      if (!shell.gotToken) {
        shell.gotToken = true;
        shell.buffer = "";
        shell.msg.textContent = "";
      }
      shell.buffer += piece;
      shell.msg.classList.remove("md", "error");
      shell.msg.classList.add("streaming");
      shell.msg.textContent = shell.buffer;
    }

    function finalizeBot(shell, text, isError) {
      shell.status.textContent = "";
      const finalText = text == null ? shell.buffer : text;
      shell.buffer = finalText || "";
      if (isError) {
        shell.msg.classList.remove("md", "streaming");
        shell.msg.classList.add("error");
        shell.msg.textContent = finalText || "服务内部错误";
        return;
      }
      const { html } = renderMarkdown(shell.buffer);
      shell.msg.classList.remove("streaming", "error");
      if (html != null) {
        shell.msg.classList.add("md");
        shell.msg.innerHTML = html;
        shell.msg.querySelectorAll("a[href]").forEach((a) => {
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener noreferrer");
        });
      } else {
        shell.msg.classList.remove("md");
        shell.msg.textContent = shell.buffer;
      }
    }

    function addBotGreeting(text) {
      const shell = addBotShell();
      finalizeBot(shell, text, false);
    }

    function bindChips() {
      chips.querySelectorAll("button.chip").forEach((btn) => {
        btn.onclick = () => {
          const q = btn.dataset.q;
          if (q) ask(q);
        };
      });
    }

    function renderChipOptions(options) {
      chips.innerHTML = "";
      (options || []).forEach((opt) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.dataset.q = opt.message;
        btn.textContent = opt.label;
        chips.appendChild(btn);
      });
      bindChips();
    }

    async function loadGreet() {
      try {
        const res = await fetch("/greet", { headers: { "X-Tenant-Id": "demo" } });
        if (!res.ok) {
          const el = document.getElementById("empty");
          if (el) el.textContent = "欢迎咨询课程与订单问题";
          return;
        }
        const data = await res.json();
        if (data.greeting) addBotGreeting(data.greeting);
        if (Array.isArray(data.options) && data.options.length) {
          renderChipOptions(data.options);
        } else {
          bindChips();
        }
      } catch (_) {
        const el = document.getElementById("empty");
        if (el) el.textContent = "欢迎咨询课程与订单问题";
        bindChips();
      }
    }

    function startNewSession() {
      if (form.dataset.pending === "1") return;
      sessionStorage.removeItem("cs_session_id");
      log.innerHTML = "";
      const placeholder = document.createElement("div");
      placeholder.className = "empty";
      placeholder.id = "empty";
      placeholder.textContent = "正在加载开场白…";
      log.appendChild(placeholder);
      loadGreet().then(() => {
        input.focus();
      });
    }

    async function ask(text) {
      if (form.dataset.pending === "1") return;
      const q = (text || "").trim();
      if (!q) return;
      setPending(true);
      addUser(q);
      const shell = addBotShell();
      shell.status.textContent = "正在处理…";
      try {
        const userId = currentUser();
        if (sessionStorage.getItem("cs_user_id") !== userId) {
          sessionStorage.removeItem("cs_session_id");
        }
        sessionStorage.setItem("cs_user_id", userId);
        const sessionId = sessionStorage.getItem("cs_session_id") || undefined;
        const body = { message: q, user_id: userId };
        if (sessionId) body.session_id = sessionId;
        const res = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "text/event-stream",
            "X-Tenant-Id": "demo",
            "X-User-Id": userId
          },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          let detail = "请求失败（" + res.status + "）";
          try {
            const err = await res.json();
            if (err && err.detail) detail = typeof err.detail === "string" ? err.detail : JSON.stringify(err.detail);
          } catch (_) {}
          finalizeBot(shell, detail, true);
          return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const blocks = buf.split("\n\n");
          buf = blocks.pop();
          for (const block of blocks) {
            let event = "message";
            const dataLines = [];
            for (const line of block.split("\n")) {
              if (line.startsWith("event:")) event = line.slice(6).trim();
              else if (line.startsWith("data:")) dataLines.push(line.slice(5).trimStart());
            }
            if (!dataLines.length) continue;
            let data;
            try {
              data = JSON.parse(dataLines.join("\n"));
            } catch (_) {
              continue;
            }
            if (event === "meta" && data.session_id) {
              sessionStorage.setItem("cs_session_id", data.session_id);
              if (data.request_id) shell.requestId = data.request_id;
              if (data.trace_id) shell.traceId = data.trace_id;
              if (data.session_id) shell.sessionId = data.session_id;
            } else if (event === "status" && data.message) {
              shell.status.textContent = data.message;
            } else if (event === "token" && data.content) {
              appendBotToken(shell, data.content);
              scrollLog();
            } else if (event === "answer" && data.answer) {
              if (!shell.gotToken) setBotPlain(shell, data.answer);
              else {
                shell.buffer = data.answer;
                shell.msg.textContent = data.answer;
              }
              scrollLog();
            } else if (event === "done") {
              if (data.session_id) {
                sessionStorage.setItem("cs_session_id", data.session_id);
                shell.sessionId = data.session_id;
              }
              if (data.request_id) shell.requestId = data.request_id;
              if (data.trace_id) shell.traceId = data.trace_id;
              finalizeBot(shell, data.answer || shell.buffer || "", false);
              attachFeedback(shell);
              scrollLog();
            } else if (event === "error") {
              finalizeBot(shell, data.detail || "服务内部错误", true);
            }
          }
        }
        if (!shell.msg.classList.contains("md") && !shell.msg.classList.contains("error")) {
          finalizeBot(shell, shell.buffer || "（无回复）", !shell.buffer);
        }
      } catch (err) {
        finalizeBot(shell, "网络异常，请稍后重试", true);
      } finally {
        setPending(false);
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      ask(text);
    });

    newSessionBtn.addEventListener("click", startNewSession);

    userInput.addEventListener("change", () => {
      const userId = currentUser();
      if (sessionStorage.getItem("cs_user_id") !== userId) {
        sessionStorage.removeItem("cs_session_id");
        sessionStorage.setItem("cs_user_id", userId);
      }
    });

    bindChips();
    loadGreet();
  </script>
</body>
</html>
